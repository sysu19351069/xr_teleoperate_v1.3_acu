elfin_arm_controller:
  type: position_controllers/JointTrajectoryController
  joints:
     - elfin_joint1
     - elfin_joint2
     - elfin_joint3
     - elfin_joint4
     - elfin_joint5
     - elfin_joint6
  /gazebo_ros_control:
    pid_gains:
      elfin_joint1:
        p: 100.0
        i: 1
        d: 0.1
      elfin_joint2:
        p: 100.0
        i: 1
        d: 0.1
      elfin_joint3:
        p: 100.0
        i: 1
        d: 0.1
      elfin_joint4:
        p: 100.0
        i: 1
        d: 0.1
      elfin_joint5:
        p: 100.0
        i: 1
        d: 0.1
      elfin_joint6:
        p: 100.0
        i: 1
        d: 0.1
  constraints:
      goal_time: 0.6
      stopped_velocity_tolerance: 0.1

  stop_trajectory_duration: 0.05
  state_publish_rate:  25
  action_monitor_rate: 10
 

